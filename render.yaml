# Free demonstration mode: the service may sleep; its database and signing key reset on restart.
services:
  - type: web
    name: setutrace-demo
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOSTED_DEMO
        value: 'true'
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/setutrace-data
      - key: DEMO_ACCESS_CODE
        generateValue: true
      - key: APP_ORIGINS
        sync: false
